<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeroviation RPC Landing Page Drafts — Review Switcher</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A173B;
    --navy-light: #152656;
    --terra: #B16C51;
    --terra-hover: #9c5b41;
    --sand: #CAB99B;
    --cream: #F3F1EA;
    --border: rgba(255, 255, 255, 0.14);
    --bar-height: 54px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #1b2234;
    font-family: "InterDisplay", "Inter", system-ui, -apple-system, sans-serif;
    color: #ffffff;
  }

  /* Top Review Switcher Bar */
  .review-bar {
    height: var(--bar-height);
    background: var(--navy);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    gap: 12px;
    position: relative;
    z-index: 100;
    transition: transform 0.22s ease, height 0.22s ease;
  }

  body.bar-hidden .review-bar {
    height: 0;
    overflow: hidden;
    border-bottom: none;
  }

  .brand-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--sand);
    white-space: nowrap;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--terra);
    flex-shrink: 0;
  }

  /* Target Market Segmented Toggle */
  .market-toggle {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.07);
    padding: 4px;
    border-radius: 999px;
    border: 1px solid var(--border);
    gap: 4px;
  }

  .market-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.78);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.16s ease;
    white-space: nowrap;
  }

  .market-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.06);
  }

  .market-btn.active {
    background: var(--terra);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
  }

  .badge-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(10, 23, 59, 0.35);
    color: #F3F1EA;
  }

  /* Right Controls: Viewport & External Link */
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .viewport-group {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
  }

  .vp-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.72);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .vp-btn:hover {
    color: #ffffff;
  }

  .vp-btn.active {
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
  }

  .icon-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.06);
    color: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.14);
  }

  /* Floating Restore Button when bar is collapsed */
  .restore-pill {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 200;
    background: var(--navy);
    color: #ffffff;
    border: 1px solid var(--sand);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    display: none;
    align-items: center;
    gap: 6px;
  }

  body.bar-hidden .restore-pill {
    display: inline-flex;
  }

  /* Preview Stage & Iframe */
  .stage {
    width: 100%;
    height: calc(100vh - var(--bar-height));
    display: flex;
    justify-content: center;
    align-items: stretch;
    background: #1b2234;
    transition: height 0.22s ease, padding 0.22s ease;
  }

  body.bar-hidden .stage {
    height: 100vh;
  }

  .stage.device-mode {
    padding: 16px;
  }

  iframe#preview-frame {
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
    transition: width 0.22s ease, border-radius 0.22s ease, box-shadow 0.22s ease;
  }

  .stage.device-mode iframe#preview-frame {
    border-radius: 14px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  @media (max-width: 820px) {
    .brand-label, .viewport-group, .hide-mobile {
      display: none;
    }
    .review-bar {
      justify-content: center;
      padding: 0 10px;
    }
    .market-btn {
      font-size: 12px;
      padding: 6px 11px;
    }
  }
</style>
</head>
<body>

<header class="review-bar" role="region" aria-label="Landing page draft switcher">
  <div class="brand-label">
    <span class="brand-dot" aria-hidden="true"></span>
    <span>AEROVIATION RPC DRAFTS</span>
  </div>

  <nav class="market-toggle" aria-label="Target market selection">
    <button type="button" class="market-btn active" data-market="parents" aria-pressed="true">
      Parents &amp; Teens <span class="badge-tag">15+</span>
    </button>
    <button type="button" class="market-btn" data-market="professionals" aria-pressed="false">
      Working Professionals <span class="badge-tag">Part-Time</span>
    </button>
  </nav>

  <div class="controls">
    <div class="viewport-group" role="group" aria-label="Viewport preview width">
      <button type="button" class="vp-btn active" data-width="100%">Desktop</button>
      <button type="button" class="vp-btn" data-width="768px">Tablet</button>
      <button type="button" class="vp-btn" data-width="390px">Mobile</button>
    </div>
    <a id="open-direct" class="icon-btn hide-mobile" href="./aeroviation-rpc-parent-landing-page.html" target="_blank" rel="noopener">
      Open Tab &#8599;
    </a>
    <button type="button" id="hide-bar" class="icon-btn hide-mobile" title="Hide toolbar for full-screen view">
      Hide Bar
    </button>
  </div>
</header>

<button type="button" id="show-bar" class="restore-pill">
  <span class="brand-dot" aria-hidden="true"></span> Switch Draft
</button>

<main class="stage" id="stage">
  <iframe
    id="preview-frame"
    src="./aeroviation-rpc-parent-landing-page.html"
    title="Aeroviation Recreational Pilot Course Landing Page Preview"
  ></iframe>
</main>

<script>
  (function () {
    const DRAFTS = {
      parents: {
        file: "./aeroviation-rpc-parent-landing-page.html",
        label: "Parents & Teens (15+) — Aeroviation RPC Draft"
      },
      professionals: {
        file: "./aeroviation-rpc-working-professional-landing-page.html",
        label: "Working Professionals — Aeroviation RPC Draft"
      }
    };

    const frame = document.getElementById("preview-frame");
    const openDirect = document.getElementById("open-direct");
    const marketBtns = document.querySelectorAll(".market-btn");
    const vpBtns = document.querySelectorAll(".vp-btn");
    const stage = document.getElementById("stage");
    const hideBarBtn = document.getElementById("hide-bar");
    const showBarBtn = document.getElementById("show-bar");

    function selectMarket(key, updateHash) {
      const draft = DRAFTS[key] || DRAFTS.parents;
      frame.src = draft.file;
      frame.title = draft.label;
      openDirect.href = draft.file;

      marketBtns.forEach(function (btn) {
        const isActive = btn.getAttribute("data-market") === key;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", isActive ? "true" : "false");
      });

      if (updateHash) {
        history.replaceState(null, "", "#" + key);
      }
    }

    marketBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        selectMarket(btn.getAttribute("data-market"), true);
      });
    });

    vpBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        const w = btn.getAttribute("data-width");
        frame.style.width = w;
        stage.classList.toggle("device-mode", w !== "100%");
        vpBtns.forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
      });
    });

    hideBarBtn.addEventListener("click", function () {
      document.body.classList.add("bar-hidden");
    });

    showBarBtn.addEventListener("click", function () {
      document.body.classList.remove("bar-hidden");
    });

    // Support direct hash links (#parents or #professionals)
    const initialHash = window.location.hash.replace("#", "").toLowerCase();
    if (DRAFTS[initialHash]) {
      selectMarket(initialHash, false);
    }
  })();
</script>

</body>
</html>
